[project]
name = "timechamp-backend"
version = "1.0.0"
description = "Timechamp Production Asynchronous Analytics & Event Processing Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "clickhouse-connect>=0.7.16",
    "redis>=5.0.4",
    "celery[redis]>=5.4.0",
    "orjson>=3.10.3",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.6",
    "ruff>=0.4.8"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
